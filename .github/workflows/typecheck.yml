name: TypeScript check

on:
  push:
    branches:
      - motorist-mechanic-functional
      - feature/android-floating-mechanic-offers
      - feature/parts-dealer-dashboard
  pull_request:
    branches:
      - functional-demo
      - main
      - motorist-mechanic-functional

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Confirm generated Android manifest has native overlay FCM service
        run: |
          npx expo prebuild --platform android --clean --no-install
          grep -q 'AutoAssistFirebaseMessagingService' android/app/src/main/AndroidManifest.xml
          grep -q 'ExpoFirebaseMessagingService' android/app/src/main/AndroidManifest.xml

      - name: Verify floating overlay Gradle dependencies resolve
        run: |
          cd android
          ./gradlew :autoassist-overlay:dependencies --configuration debugCompileClasspath --no-daemon --console=plain

